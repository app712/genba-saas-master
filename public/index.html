<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SaaSマスター | 新規企業登録</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container card p-4 shadow-sm" style="max-width: 600px; margin: 0 auto;">
    <h2 class="mb-4">新規企業登録・環境構築</h2>
    <p class="text-muted small">企業ID、専用フォルダ一式（明細・台帳など）、データベースはすべて自動生成されます。</p>
    
    <div class="mb-3">
      <label>企業名（必須）</label>
      <input type="text" id="compName" class="form-control" placeholder="例: 株式会社〇〇">
    </div>
    <div class="mb-3">
      <label>管理者メールアドレス（必須）</label>
      <input type="email" id="email" class="form-control" placeholder="例: admin@example.com">
    </div>
    <div class="mb-3">
      <label>初期パスワード（必須）</label>
      <input type="password" id="password" class="form-control" placeholder="半角英数字">
    </div>
    
    <button onclick="register()" class="btn btn-primary w-100">登録・環境構築開始</button>
    <div id="result" class="mt-3 text-center fw-bold"></div>
  </div>

  <script>
    // ==========================================
    // 設定変数（必ず一番上で定義）
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwozySsnNxv7O2niAkZR_Sy-Q8pMajpb8EjzzkbPiKONRdozSRQQyiatdnzwXgm7RdY/exec";

    async function register() {
      const compName = document.getElementById('compName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const resultDiv = document.getElementById('result');

      if (!compName || !email || !password) {
        alert("すべての項目を入力してください。");
        return;
      }

      resultDiv.innerText = "環境構築中です。フォルダ群の作成とスプレッドシートのコピーを行っているため約20秒かかります...";
      resultDiv.className = "mt-3 text-center fw-bold text-secondary";

      try {
        const data = { action: 'register', companyName: compName, email: email, password: password };
        const res = await fetch(GAS_WEB_APP_URL, { 
          method: 'POST', 
          body: JSON.stringify(data),
          headers: { 'Content-Type': 'text/plain' }
        });
        
        const json = await res.json();
        if (json.status === "success") {
          resultDiv.innerText = json.message;
          resultDiv.className = "mt-3 text-center fw-bold text-success";
          document.getElementById('compName').value = "";
          document.getElementById('email').value = "";
          document.getElementById('password').value = "";
        } else {
          resultDiv.innerText = "エラー: " + json.message;
          resultDiv.className = "mt-3 text-center fw-bold text-danger";
        }
      } catch (e) {
        resultDiv.innerText = "通信エラーが発生しました。";
        resultDiv.className = "mt-3 text-center fw-bold text-danger";
      }
    }
  </script>
</body>
</html>

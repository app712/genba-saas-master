<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaSマスター管理 | 現場のミカタ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">現場のミカタ SaaSテナント管理</span>
    </div>
  </nav>

  <div class="container">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white fw-bold">新規テナント登録</div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label fw-bold small">企業名</label>
              <input type="text" id="compName" class="form-control" placeholder="例: テスト建設 株式会社">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold small">管理者メールアドレス</label>
              <input type="email" id="adminEmail" class="form-control" placeholder="admin@example.com">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold small">初期パスワード</label>
              <input type="text" id="adminPass" class="form-control" placeholder="半角英数字">
            </div>
            <button onclick="registerTenant()" class="btn btn-primary w-100 fw-bold">テナント環境を構築</button>
            <div id="regResult" class="mt-3 fw-bold small" style="white-space: pre-wrap;"></div>
          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-secondary text-white fw-bold d-flex justify-content-between align-items-center">
            <span>契約テナント一覧</span>
            <button onclick="loadTenants()" class="btn btn-sm btn-light fw-bold">更新</button>
          </div>
          <div class="card-body p-0">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-3">企業ID</th>
                  <th>企業名</th>
                  <th>登録日</th>
                  <th class="text-center">操作</th>
                </tr>
              </thead>
              <tbody id="tenantList">
                <tr><td colspan="4" class="text-center py-3">読み込み中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="row mt-4 mb-5">
      <div class="col-12">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
            <span><i class="bi bi-terminal"></i> 開発用システムログ</span>
            <button onclick="document.getElementById('logContent').innerHTML=''" class="btn btn-sm btn-outline-light">クリア</button>
          </div>
          <div class="card-body bg-black text-light p-3" style="height: 250px; overflow-y: auto; font-family: monospace; font-size: 0.85rem;" id="logContent">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 最新のGAS URL
    // ==========================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyg97hvDzBZTt5W1S9xBRGz--pcrlZLHPdzRfM6H8X_tIKbK-w4ozNeIoqbhQlrCC6d/exec";

    function addLog(msg, type="info") {
      const logBox = document.getElementById('logContent');
      const time = new Date().toLocaleTimeString();
      let color = type === 'error' ? '#ff6b6b' : (type === 'success' ? '#51cf66' : '#f8f9fa');
      logBox.innerHTML += `<div style="color: ${color}; margin-bottom: 4px;">[${time}] ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    window.onload = () => {
      addLog("画面の初期化完了。テナント一覧の取得を開始します。");
      loadTenants();
    };

    async function loadTenants() {
      const tbody = document.getElementById('tenantList');
      addLog(`[POST] 宛先: ${GAS_URL.substring(0, 50)}...`);
      
      try {
        const payload = { action: "getCompanies" };
        const res = await fetch(GAS_URL, { 
          method: "POST", 
          body: JSON.stringify(payload), 
          headers: { 'Content-Type': 'text/plain' } 
        });
        
        addLog(`HTTPステータス: ${res.status} ${res.statusText}`, res.ok ? "success" : "error");
        
        if (!res.ok) {
          const errText = await res.text();
          addLog(`レスポンスエラー詳細: ${errText.substring(0, 100)}`, "error");
          throw new Error(`HTTP ${res.status}`);
        }

        const json = await res.json();
        addLog(`データパース成功: 状態=${json.status}`, "success");
        
        if (json.status === "success") {
          tbody.innerHTML = "";
          if (json.companies.length === 0) {
            tbody.innerHTML = "<tr><td colspan='4' class='text-center py-3'>登録されているテナントはありません。</td></tr>";
            return;
          }
          json.companies.forEach(c => {
            tbody.innerHTML += `
              <tr>
                <td class="ps-3 fw-bold text-primary">${c.companyId}</td>
                <td class="fw-bold">${c.companyName}</td>
                <td class="small">${c.createdAt ? new Date(c.createdAt).toLocaleDateString() : '-'}</td>
                <td class="text-center">
                  <button onclick="deleteTenant('${c.companyId}')" class="btn btn-outline-danger btn-sm fw-bold">削除</button>
                </td>
              </tr>
            `;
          });
        } else {
          addLog(`GAS側エラー: ${json.message}`, "error");
          tbody.innerHTML = `<tr><td colspan='4' class='text-center py-3 text-danger'>エラー: ${json.message}</td></tr>`;
        }
      } catch (e) {
        addLog(`[Failed to fetch] 致命的な通信エラー: ${e.name} - ${e.message}`, "error");
        tbody.innerHTML = `<tr><td colspan='4' class='text-center py-3 text-danger'>通信エラー: データの取得に失敗しました。<br><small>${e.message}</small></td></tr>`;
      }
    }

    async function registerTenant() {
      const name = document.getElementById('compName').value;
      const email = document.getElementById('adminEmail').value;
      const pass = document.getElementById('adminPass').value;
      const resDiv = document.getElementById('regResult');

      if (!name || !email || !pass) {
        addLog("入力不足のため登録をキャンセルしました", "error");
        return alert("全て入力してください。");
      }
      
      resDiv.innerText = "SaaS環境を構築中...";
      resDiv.className = "mt-3 text-secondary";
      
      const payload = { action: "registerCompany", companyName: name, adminEmail: email, adminPass: pass };
      addLog(`[POST] registerCompany: ${name}`);

      try {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain' } });
        addLog(`HTTPステータス: ${res.status}`);
        
        const json = await res.json();
        addLog(`応答結果: ${json.status}`, json.status === "success" ? "success" : "error");
        
        if (json.status === "success") {
          resDiv.innerText = "構築完了しました";
          resDiv.className = "mt-3 text-success";
          document.getElementById('compName').value = "";
          document.getElementById('adminEmail').value = "";
          document.getElementById('adminPass').value = "";
          loadTenants();
        } else {
          resDiv.innerText = "エラー: " + json.message;
          resDiv.className = "mt-3 text-danger";
        }
      } catch (e) {
        addLog(`[Failed to fetch] 登録通信エラー: ${e.message}`, "error");
        resDiv.innerText = "通信エラーが発生しました。";
        resDiv.className = "mt-3 text-danger";
      }
    }

    async function deleteTenant(compId) {
      if (!confirm(`本当にテナント [${compId}] を削除しますか？\n※Googleドライブ上のフォルダはゴミ箱に移動されます。`)) return;
      
      addLog(`[POST] deleteCompany: ${compId}`);
      const payload = { action: "deleteCompany", companyId: compId };

      try {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain' } });
        const json = await res.json();
        
        if (json.status === "success") {
          addLog(`削除成功: ${compId}`, "success");
          alert(json.message);
          loadTenants();
        } else {
          addLog(`削除エラー: ${json.message}`, "error");
          alert("エラー: " + json.message);
        }
      } catch (e) {
        addLog(`[Failed to fetch] 削除通信エラー: ${e.message}`, "error");
        alert("通信エラーが発生しました。");
      }
    }
  </script>
</body>
</html>

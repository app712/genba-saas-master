<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaSマスター管理 | 現場のミカタ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">現場のミカタ SaaSテナント管理</span>
    </div>
  </nav>

  <div class="container">
    <div class="row g-4">
      <!-- 登録フォーム -->
      <div class="col-md-4">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white fw-bold">新規テナント登録</div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label fw-bold small">企業名</label>
              <input type="text" id="compName" class="form-control" placeholder="例: テスト建設 株式会社">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold small">管理者メールアドレス</label>
              <input type="email" id="adminEmail" class="form-control" placeholder="admin@example.com">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold small">初期パスワード</label>
              <input type="text" id="adminPass" class="form-control" placeholder="半角英数字">
            </div>
            <button onclick="registerTenant()" class="btn btn-primary w-100 fw-bold">テナント環境を構築</button>
            <div id="regResult" class="mt-3 fw-bold small" style="white-space: pre-wrap;"></div>
          </div>
        </div>
      </div>

      <!-- 企業一覧 -->
      <div class="col-md-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-secondary text-white fw-bold d-flex justify-content-between align-items-center">
            <span>契約テナント一覧</span>
            <button onclick="loadTenants()" class="btn btn-sm btn-light fw-bold">更新</button>
          </div>
          <div class="card-body p-0">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-3">企業ID</th>
                  <th>企業名</th>
                  <th>登録日</th>
                  <th class="text-center">操作</th>
                </tr>
              </thead>
              <tbody id="tenantList">
                <tr><td colspan="4" class="text-center py-3">読み込み中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
